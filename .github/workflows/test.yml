name: CI
on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    # Keep this image in sync with @playwright/test in yarn.lock and frames.yml.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test

      # Deterministic operation counts (sorts, collides calls, clones, renders).
      # Requires exact equality with test/bench/baseline.json.
      - name: Check operation-count budgets
        run: yarn bench:ops

      - name: Run lint
        run: yarn lint

      - name: Build the library
        run: yarn build

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build the e2e harness
        run: make e2e-build

      - name: Check image matches installed Playwright
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.62.1')"

      - name: Run Playwright e2e tests
        run: yarn playwright test --config playwright.config.ts

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
